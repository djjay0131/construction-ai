name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sprint 2 + 3a tests with coverage
        working-directory: backend
        run: |
          pytest \
            tests/test_kg_client.py \
            tests/test_kg_provenance.py \
            tests/test_kg_loader.py \
            tests/test_kg_integration.py \
            tests/test_lumber_calculator_refactor.py \
            tests/test_health_endpoint.py \
            tests/test_smoke_test_script.py \
            tests/test_image_preprocessor.py \
            tests/test_coordinate_converter.py \
            tests/test_wall_line_extractor.py \
            tests/test_scale_detector.py \
            tests/test_raster_parser.py \
            tests/test_dimension_parser.py \
            tests/test_dimension_extractor.py \
            tests/test_spatial_association.py \
            tests/test_catalog_builder.py \
            tests/test_catalog_store.py \
            tests/test_easyocr_reader.py \
            tests/test_validation_summary.py \
            tests/test_catalog_endpoint.py \
            tests/test_raster_takeoff.py \
            tests/test_pdf_takeoff.py \
            tests/test_pdf_parser.py \
            tests/integration/test_phase1_e2e.py \
            --cov=app.core.kg \
            --cov=app.api.health \
            --cov=scripts.smoke_test \
            --cov=app.core.cv.image_preprocessor \
            --cov=app.core.cv.coordinate_converter \
            --cov=app.core.cv.wall_line_extractor \
            --cov=app.core.cv.scale_detector \
            --cov=app.core.parsers.raster_parser \
            --cov=app.core.cv.dimension_parser \
            --cov=app.core.cv.dimension_extractor \
            --cov=app.core.catalog \
            --cov=app.core.cv.easyocr_reader \
            --cov=app.api.catalog \
            --cov=app.core.raster_takeoff \
            --cov=app.core.pdf_takeoff \
            --cov=app.core.parsers.pdf_parser \
            --cov-report=term \
            --cov-report=xml \
            -q

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: warn
